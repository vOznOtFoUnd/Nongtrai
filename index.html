<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nông Trại 3D - Modular Stable</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container">
    <div id="loading">
      <div class="loader"></div>
      <div id="loading-text" class="loading-text">Đang tải Nông Trại 3D...</div>
      <div id="loading-error" role="alert" aria-live="assertive" hidden></div>
      <button id="loading-retry" type="button" hidden>Tải lại game</button>
    </div>
    <div id="ui">
      <div id="top-bar">
        <div id="stats" class="panel" aria-label="Thông tin nông trại">
          <span class="stat-item stat-money">💰 <span id="money">500</span></span>
          <span class="stat-item stat-level">⭐ Lv.<span id="level">1</span> <span class="stat-exp">(<span id="exp">0/100</span>)</span></span>
          <span class="stat-item stat-harvest">🌱 <span id="harvested">0</span></span>
          <span class="stat-item stat-time">📅 Ngày <span id="day">1</span> <span class="stat-clock">🕒 <time id="game-clock" aria-label="Giờ trong game">06:00</time></span></span>
        </div>
        <div id="tools" class="panel" aria-label="Thanh công cụ nông trại">
          <button class="tool-btn" data-tool="hoe" type="button" title="Cuốc đất">⛏️ Cuốc</button>
          <button class="tool-btn active" data-tool="plant" type="button" title="Trồng hạt giống">🌱 Trồng</button>
          <button class="tool-btn" data-tool="water" type="button" title="Tưới cây">💧 Tưới</button>
          <button class="tool-btn" data-tool="harvest" type="button" title="Thu hoạch">🧺 Thu</button>
          <span class="toolbar-divider" aria-hidden="true"></span>
          <button id="camera-zoom-in" class="utility-btn" type="button" title="Phóng to góc nhìn" aria-label="Phóng to góc nhìn">＋</button>
          <button id="camera-zoom-out" class="utility-btn" type="button" title="Thu nhỏ góc nhìn" aria-label="Thu nhỏ góc nhìn">−</button>
          <button id="camera-reset" class="utility-btn" type="button" title="Đặt lại góc nhìn" aria-label="Đặt lại góc nhìn">↺</button>
          <button id="toggle-instructions" class="utility-btn help-toggle" type="button" aria-expanded="true" aria-controls="instructions" title="Ẩn/hiện hướng dẫn">❔</button>
          <button id="open-shop" class="utility-btn management-btn" type="button" title="Cửa hàng">🛒</button>
          <button id="open-inventory" class="utility-btn management-btn" type="button" title="Túi đồ">🎒</button>
          <button id="open-quests" class="utility-btn management-btn" type="button" title="Nhiệm vụ">📜</button>
          <button id="open-assets" class="utility-btn management-btn" type="button" title="Quản lý model 3D">🧊</button>
          <button id="open-fishing" class="utility-btn management-btn" type="button" title="Hồ cá và câu cá">🐟</button>
        </div>
      </div>
      <div id="instructions" class="panel">
        <h3>🌾 Hướng dẫn</h3>
        • Kéo để xoay camera<br>
        • Chạm ô đất để mở khóa / tương tác<br>
        • Cuốc → Trồng → Tưới → Thu hoạch<br>• Đến hồ cá để nuôi cá hoặc câu cá
      </div>
      <div id="crop-info" class="panel">
        <h4>Hạt giống</h4>
        <div id="seed-list"></div>
      </div>
      <div id="message"></div>
      <div id="management-modal" class="management-modal" hidden role="dialog" aria-modal="true" aria-labelledby="management-title">
        <section class="management-card panel">
          <header class="management-header"><h2 id="management-title">Quản lý nông trại</h2><button id="close-management" type="button" aria-label="Đóng">✕</button></header>
          <div id="management-content"></div>
        </section>
      </div>
      <div id="mobile-joystick" aria-label="Joystick di chuyển nhân vật" role="application">
        <div class="joystick-ring"><div class="joystick-direction" aria-hidden="true">＋</div><div id="joystick-knob" class="joystick-knob"></div></div>
        <span class="joystick-caption">DI CHUYỂN</span>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    const loading = document.getElementById('loading');
    const loadingText = document.getElementById('loading-text');
    const loadingError = document.getElementById('loading-error');
    const loadingRetry = document.getElementById('loading-retry');
    let saveGame = null;
    let ui = null;

    function showStartupError(error) {
      console.error('Không thể khởi tạo Nông Trại 3D:', error);
      loading.classList.add('has-error');
      loadingText.textContent = 'Không thể khởi tạo Nông Trại 3D.';
      loadingError.hidden = false;
      const detail = error && error.message ? error.message : String(error || 'Lỗi không xác định');
      const localFileHint = window.location.protocol === 'file:'
        ? '\n\nBạn đang mở file trực tiếp. Chrome có thể chặn ES Modules khi dùng file://. Hãy chạy game qua máy chủ HTTP/HTTPS hoặc GitHub Pages.'
        : '\n\nHãy kiểm tra kết nối mạng và các lỗi tải tài nguyên trong Console.';
      loadingError.textContent = detail + localFileHint;
      loadingRetry.hidden = false;
    }

    loadingRetry.addEventListener('click', () => window.location.reload());

    window.addEventListener('error', (event) => {
      console.error('Lỗi JavaScript khi chạy game:', event.error || event.message);
      if (loading.classList.contains('hidden')) {
        if (ui) ui.showMessage('Game gặp lỗi JavaScript. Mở Console để xem chi tiết.');
      } else {
        showStartupError(event.error || event.message);
      }
    });

    window.addEventListener('unhandledrejection', (event) => {
      console.error('Promise bị từ chối khi chạy game:', event.reason);
      if (!loading.classList.contains('hidden')) showStartupError(event.reason);
    });

    async function startGame() {
      try {
        // Tải module động để có thể bắt lỗi import/CDN và hiện thông báo thay vì màn hình đen.
        const [stateModule, sceneModule, uiModule, inputModule, timeModule, weatherModule, playerModule, assetModule, previewModule] = await Promise.all([
          import('./js/data/state.js'),
          import('./js/world/scene.js'),
          import('./js/ui/ui.js'),
          import('./js/player/input.js'),
          import('./js/systems/time.js'),
          import('./js/systems/weather.js'),
          import('./js/player/player.js'),
          import('./js/assets/AssetManager.js'),
          import('./js/assets/AssetPreview.js')
        ]);

        saveGame = stateModule.saveGame;
        const { GameScene } = sceneModule;
        const { UI } = uiModule;
        const { Input } = inputModule;
        const { GameTime } = timeModule;
        const { WeatherManager } = weatherModule;
        const { PlayerCharacter } = playerModule;
        const { AssetManager } = assetModule;
        const { AssetPreview } = previewModule;
        // AssetManager là lớp mở rộng; model dựng sẵn vẫn được dùng nếu chưa có asset tùy chỉnh.
        const assetManager = new AssetManager({ onError: error => console.warn('Asset tùy chỉnh:', error) });
        window.farmAssetManager = assetManager; // API debug/tiện ích cho bước tích hợp model tiếp theo.

        const container = document.getElementById('game-container');
        ui = new UI();
        const gameScene = new GameScene(container, msg => ui.showMessage(msg));
        const player = new PlayerCharacter(
          gameScene.scene,
          gameScene.controls,
          msg => ui.showMessage(msg),
          () => gameScene.getPlayerCollisionData()
        );
        new Input(gameScene.camera, gameScene.plotsGroup, gameScene.domElement, player);
        ui.setManagementContext(msg => ui.showMessage(msg));
        ui.setAssetContext({ assetManager, player, AssetPreview, showMessage: msg => ui.showMessage(msg) });

        // Camera quick actions inspired by FIX80.7; only adjust the existing OrbitControls camera.
        const zoomCamera = factor => {
          const controls = gameScene.controls;
          if (!controls || !gameScene.camera) return;
          const offset = gameScene.camera.position.clone().sub(controls.target);
          const distance = offset.length();
          const min = Number.isFinite(controls.minDistance) ? controls.minDistance : 2;
          const max = Number.isFinite(controls.maxDistance) ? controls.maxDistance : 100;
          const next = Math.max(min, Math.min(max, distance * factor));
          if (distance > 0) gameScene.camera.position.copy(controls.target).add(offset.multiplyScalar(next / distance));
          controls.update();
        };
        document.getElementById('camera-zoom-in')?.addEventListener('click', () => zoomCamera(0.85));
        document.getElementById('camera-zoom-out')?.addEventListener('click', () => zoomCamera(1.18));
        document.getElementById('camera-reset')?.addEventListener('click', () => {
          if (gameScene.controls && typeof gameScene.controls.reset === 'function') gameScene.controls.reset();
        });

        const gameTime = new GameTime((day) => {
          ui.showMessage(`Chào buổi sáng! Ngày ${day} ☀️`);
        });
        const weatherManager = new WeatherManager(() => {});
        let lastTime = performance.now();

        function animate(now) {
          requestAnimationFrame(animate);
          const dt = Math.min((now - lastTime) / 1000, 0.1);
          lastTime = now;

          const dayProgress = gameTime.update(dt, () => ui.update());
          weatherManager.update(
            dt,
            gameScene.plotsGroup.children.map(p => p.userData.plot).filter(Boolean),
            msg => ui.showMessage(msg)
          );
          gameScene.updateDayNight(dayProgress);
          player.update(dt);

          for (const plotObj of gameScene.plotsGroup.children) {
            if (plotObj.userData && plotObj.userData.plot) plotObj.userData.plot.update(dt);
          }

          ui.update();
          gameScene.render(dt);
        }

        window.addEventListener('resize', () => gameScene.onResize());
        window.addEventListener('beforeunload', () => {
          if (saveGame) saveGame();
        });
        window.addEventListener('pagehide', () => {
          if (saveGame) saveGame();
          assetManager.dispose();
        });

        ui.update();
        ui.hideLoading();
        if (window.matchMedia('(max-width: 900px)').matches) { try { await screen.orientation?.lock?.('landscape'); } catch (_) {} }
        ui.showMessage('Chào mừng trở lại Nông Trại 3D! 🌾');
        animate(performance.now());
      } catch (error) {
        showStartupError(error);
      }
    }

    const rotateNotice = document.createElement('div');
    rotateNotice.id = 'rotate-notice';
    rotateNotice.innerHTML = '<div class="rotate-card"><div class="rotate-icon">📱 ↻</div><strong>Hãy xoay điện thoại ngang</strong><span>Farmnhamnhi được tối ưu cho màn hình ngang.</span></div>';
    document.body.appendChild(rotateNotice);
    function updateRotateNotice() { rotateNotice.classList.toggle('visible', window.innerWidth < window.innerHeight && window.innerWidth <= 900); }
    window.addEventListener('resize', updateRotateNotice); window.addEventListener('orientationchange', updateRotateNotice); updateRotateNotice();
    startGame();
  </script>
</body>
</html>
